<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student QR Code</title>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        input {
            display: block;
            width: 280px;
            padding: 12px;
            margin: 10px auto;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #qrcode {
            margin: 30px auto;
            width: 256px;
        }
    </style>
</head>

<body>

    <h2>Student QR Code Generator</h2>

    <input type="text" id="name" placeholder="Enter Name" value="Prushotam">
    <input type="text" id="from" placeholder="Enter From" value="Ropar">
    <input type="text" id="stream" placeholder="Enter Stream" value="BCA">
    <input type="text" id="college" placeholder="Enter College" value="LTSU">

    <button onclick="generateQR()">Generate QR Code</button>

    <div id="qrcode"></div>

    <script>
        function generateQR() {

            let name = document.getElementById("name").value;
            let from = document.getElementById("from").value;
            let stream = document.getElementById("stream").value;
            let college = document.getElementById("college").value;

            let data =
                "Name: " + name + "\n" +
                "From: " + from + "\n" +
                "Stream: " + stream + "\n" +
                "College: " + college;

            document.getElementById("qrcode").innerHTML = "";

            new QRCode(document.getElementById("qrcode"), {
                text: data,
                width: 256,
                height: 256,
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        // Automatically generate QR when page opens
        generateQR();
    </script>

</body>
</html>
