<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salon Website</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff;
}
.slider {
  position: relative;
  width: 100%;
  height: 70vh;
  overflow: hidden;
}
.slide {
  position: absolute;
  width: 100%;
  height: 100%;
  opacity: 0;
  transition: opacity 1s ease;
}
.slide.active {
  opacity: 1;
}
.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.overlay {
  position: absolute;
  bottom: 20%;
  left: 10%;
  color: white;
  background: rgba(0,0,0,0.5);
  padding: 20px;
}
button {
  background: gold;
  border: none;
  padding: 10px 20px;
  cursor: pointer;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="slider">
  <div class="slide active">
    <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?q=80&w=1600" />
  </div>
  <div class="slide">
    <img src="https://images.unsplash.com/photo-1519415943484-9fa1873496d4?q=80&w=1600" />
  </div>
  <div class="slide">
    <img src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?q=80&w=1600" />
  </div>

  <div class="overlay">
    <h1>Premium Salon</h1>
    <p>Style. Grooming. Confidence.</p>
    <button>Book Now</button>
  </div>
</div>

<script>
let slides = document.querySelectorAll(".slide");
let index = 0;

setInterval(() => {
  slides[index].classList.remove("active");
  index = (index + 1) % slides.length;
  slides[index].classList.add("active");
}, 3000);
</script>

</body>
</html>
