<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RB SALON | Official Website</title>
    <style>
        /* Modern & Premium Look */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background-color: #f9f9f9; color: #333; line-height: 1.6; }

        /* Header & Logo Section */
        header { background: #000; color: #d4af37; padding: 30px 20px; text-align: center; border-bottom: 4px solid #d4af37; }
        .logo-text { font-size: 40px; font-weight: bold; letter-spacing: 3px; text-transform: uppercase; }
        .tagline { color: #fff; font-size: 14px; margin-top: 5px; letter-spacing: 1px; }

        /* Navigation Bar */
        nav { background: #222; padding: 10px; text-align: center; position: sticky; top: 0; z-index: 1000; }
        nav a { color: #fff; text-decoration: none; margin: 0 20px; font-weight: bold; font-size: 16px; transition: 0.3s; }
        nav a:hover { color: #d4af37; }

        /* Main Container */
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .section-title { text-align: center; margin-bottom: 40px; font-size: 28px; font-weight: bold; text-transform: uppercase; border-bottom: 2px solid #d4af37; display: inline-block; padding-bottom: 10px; margin-left: 50%; transform: translateX(-50%); }

        /* Services Grid */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .service-card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-bottom: 4px solid #d4af37; transition: 0.3s; }
        .service-card:hover { transform: translateY(-10px); }

        /* Photo Fix: Yahan photos dikhengi */
        .service-card img { width: 100%; height: 250px; object-fit: cover; border-bottom: 1px solid #ddd; }
        
        .service-info { padding: 20px; text-align: center; }
        .service-info h3 { font-size: 22px; margin-bottom: 10px; color: #000; }
        .service-info p { font-size: 15px; color: #666; margin-bottom: 20px; }

        /* Buttons Fix: Ye ab click honge */
        .btn { background: #000; color: #d4af37; border: 2px solid #d4af37; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; transition: 0.3s; }
        .btn:hover { background: #d4af37; color: #000; }

        /* Booking Form */
        .booking-section { background: #eee; padding: 40px 20px; border-radius: 15px; margin-top: 50px; }
        .booking-form { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; }
        .booking-form input { padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; }

        footer { background: #000; color: #fff; text-align: center; padding: 20px; margin-top: 50px; }
    </style>
</head>
<body>

<header>
    <div class="logo-text">RB SALON</div>
    <div class="tagline">BY VISHNU & TEAM | LUXURY HAIR & SPA</div>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#services">Services</a>
    <a href="#book">Book Appointment</a>
</nav>

<div class="container" id="services">
    <h2 class="section-title">Our Services</h2>
    
    <div class="services-grid">
        <div class="service-card">
            <img src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?q=80&w=500" alt="Haircut">
            <div class="service-info">
                <h3>Haircut & Styling</h3>
                <p>Trending cuts by Vishnu.</p>
                <button class="btn" onclick="alert('Haircut Service Selected!')">Book Now</button>
            </div>
        </div>

        <div class="service-card">
            <img src="https://images.unsplash.com/photo-1621605815841-2cd6170bc392?q=80&w=500" alt="Beard">
            <div class="service-info">
                <h3>Beard Grooming</h3>
                <p>Clean shave and sharp lines.</p>
                <button class="btn" onclick="alert('Beard Service Selected!')">Book Now</button>
            </div>
        </div>

        <div class="service-card">
            <img src="https://images.unsplash.com/photo-1560066984-138dadb4c035?q=80&w=500" alt="Facial">
            <div class="service-info">
                <h3>Facial & Spa</h3>
                <p>Get that premium glow.</p>
                <button class="btn" onclick="alert('Facial Service Selected!')">Book Now</button>
            </div>
        </div>
    </div>

    <div class="booking-section" id="book">
        <h2 class="section-title">Book Your Slot</h2>
        <div class="booking-form">
            <input type="text" placeholder="Your Name" required>
            <input type="tel" placeholder="Phone Number" required>
            <button class="btn">SUBMIT REQUEST</button>
        </div>
    </div>
</div>

<footer>
    <p>&copy; 2026 RB SALON | Managed by Vishnu & Team</p>
</footer>

</body>
</html>
