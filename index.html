<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RB Saloon Booking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .box {
      max-width: 400px;
      background: #fff;
      padding: 20px;
      margin: auto;
      border-radius: 10px;
    }
    h2 {
      text-align: center;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    button {
      background: #25D366;
      color: white;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>RB Saloon Booking</h2>

    <input type="text" id="name" placeholder="Your Name">

    <select id="service">
      <option value="">Select Service</option>
      <option>Hair Cut</option>
      <option>Beard Trim</option>
      <option>Hair + Beard</option>
      <option>Facial</option>
    </select>

    <input type="date" id="date">

    <button onclick="sendWhatsApp()">Book on WhatsApp</button>
  </div>

  <script>
    function sendWhatsApp() {
      var name = document.getElementById("name").value;
      var service = document.getElementById("service").value;
      var date = document.getElementById("date").value;

      if (name === "" || service === "" || date === "") {
        alert("Please fill all details");
        return;
      }

      var phone = "917889035293"; // 👈 यहाँ अपना WhatsApp नंबर डालो

      var message =
        "New Booking%0A" +
        "Name: " + name + "%0A" +
        "Service: " + service + "%0A" +
        "Date: " + date;

      var url = "https://wa.me/" + phone + "?text=" + message;
      window.open(url, "_blank");
    }
  </script>
</body>
</html>
