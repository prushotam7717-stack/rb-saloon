<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RB SALOON | Premium Grooming</title>
    <style>
        /* CSS for Style and Layout */
        body { margin: 0; padding: 0; font-family: 'Arial', sans-serif; background-color: #0a0a0a; color: #fff; }

        /* Header & Logo Section */
        header {
            background-color: #000;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #D4AF37;
        }

        .logo-container {
            display: inline-block;
            border: 2px solid #D4AF37;
            padding: 10px 30px;
            text-align: center;
        }

        .logo-main {
            color: #D4AF37;
            font-size: 40px;
            font-weight: bold;
            letter-spacing: 10px;
            margin: 0;
            line-height: 1;
        }

        .logo-sub {
            color: #D4AF37;
            font-size: 14px;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        nav { margin-top: 20px; }
        nav a { color: #fff; text-decoration: none; margin: 0 15px; font-weight: bold; font-size: 13px; text-transform: uppercase; }

        /* Layout Container */
        .main-wrapper {
            max-width: 1200px;
            margin: 40px auto;
            display: flex;
            gap: 40px;
            padding: 0 20px;
        }

        /* Sliding Gallery Section */
        .content-left { flex: 1.5; overflow: hidden; }
        
        .slider-container {
            width: 100%;
            height: 400px;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #D4AF37;
        }

        .slides {
            display: flex;
            width: 500%;
            height: 400px;
            animation: slide 15s infinite;
        }

        .slides img { width: 20%; height: 400px; object-fit: cover; }

        @keyframes slide {
            0% { margin-left: 0; }
            20% { margin-left: 0; }
            25% { margin-left: -100%; }
            45% { margin-left: -100%; }
            50% { margin-left: -200%; }
            70% { margin-left: -200%; }
            75% { margin-left: -300%; }
            95% { margin-left: -300%; }
            100% { margin-left: -400%; }
        }

        /* Services Tabs */
        .services-info { margin-top: 30px; background: #111; padding: 20px; border-radius: 8px; }
        .service-tags { display: flex; gap: 10px; margin-top: 15px; }
        .tag { padding: 8px 15px; border: 1px solid #D4AF37; color: #D4AF37; font-size: 12px; border-radius: 4px; }

        /* Booking Form Section */
        .content-right { flex: 1; }
        .booking-card {
            background: #1a1a1a;
            color: #D4AF37;
            padding: 30px;
            border: 2px solid #D4AF37;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .booking-card h2 { text-align: center; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 15px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #eee; margin-bottom: 5px; font-size: 13px; }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #333; 
            background: #fff; 
            color: #000; 
            border-radius: 3px; 
            box-sizing: border-box; 
        }

        .submit-btn {
            width: 100%;
            background: #D4AF37;
            color: #000;
            padding: 15px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            transition: 0.3s;
        }

        .submit-btn:hover { background: #fff; }

        @media (max-width: 900px) {
            .main-wrapper { flex-direction: column; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <p class="logo-main">RB</p>
            <p class="logo-sub">SALOON</p>
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">Reviews</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <div class="main-wrapper">
        <div class="content-left">
            <div class="slider-container">
                <div class="slides">
                    <img src="https://images.unsplash.com/photo-1585747860715-2ba37e788b70?w=800" alt="Saloon 1">
                    <img src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=800" alt="Saloon 2">
                    <img src="https://images.unsplash.com/photo-1621605815841-aa33c54431dd?w=800" alt="Saloon 3">
                    <img src="https://images.unsplash.com/photo-1599351431247-f10b21ce5602?w=800" alt="Saloon 4">
                    <img src="https://images.unsplash.com/photo-1585747860715-2ba37e788b70?w=800" alt="Saloon 1">
                </div>
            </div>

            <div class="services-info">
                <h2 style="color: #D4AF37;">Premium Services</h2>
                <p>Experience the finest grooming services in town. Our experts ensure you look your best.</p>
                <div class="service-tags">
                    <div class="tag">Hair Styling</div>
                    <div class="tag">Beard Grooming</div>
                    <div class="tag">Facial Therapy</div>
                </div>
            </div>
        </div>

        <div class="content-right">
            <div class="booking-card">
                <h2>Book Your Slot</h2>
                <form id="bookingForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="custName" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label>WhatsApp Number</label>
                        <input type="tel" id="custPhone" placeholder="Enter mobile number" required>
                    </div>

                    <div class="form-group">
                        <label>Select Service</label>
                        <select id="custService" required>
                            <option value="">-- Choose a Service --</option>
                            <option value="Haircut">Haircut</option>
                            <option value="Beard Trim">Beard Trim</option>
                            <option value="Facial">Facial</option>
                            <option value="Full Grooming">Full Grooming</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Appointment Date & Time</label>
                        <input type="datetime-local" id="custTime" required>
                    </div>

                    <button type="button" class="submit-btn" onclick="sendToWhatsApp()">Confirm via WhatsApp</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function sendToWhatsApp() {
            // !!! UPDATE YOUR NUMBER HERE !!!
            var myNumber = "918360407137"; 

            var name = document.getElementById('custName').value;
            var phone = document.getElementById('custPhone').value;
            var service = document.getElementById('custService').value;
            var time = document.getElementById('custTime').value;

            if(!name || !phone || !service || !time) {
                alert("Please fill all the details first!");
                return;
            }

            var cleanTime = time.replace("T", " ");
            
            var message = "Hello RB Saloon!%0aI want to book an appointment:%0a%0a" + 
                          "*Name:* " + name + "%0a" + 
                          "*Phone:* " + phone + "%0a" + 
                          "*Service:* " + service + "%0a" + 
                          "*Scheduled Time:* " + cleanTime + "%0a%0a" +
                          "Is this slot available?";

            var waUrl = "https://wa.me/" + myNumber + "?text=" + message;
            window.open(waUrl, '_blank').focus();
        }
    </script>
</body>
</html>
