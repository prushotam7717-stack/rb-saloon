<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RB Saloon | Premium Booking</title>
    <style>
        /* --- POORA DESIGN (CSS) --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }

        /* Header & Black-Gold Theme */
        header {
            background-color: #000;
            color: #D4AF37;
            padding: 25px;
            text-align: center;
            border-bottom: 4px solid #D4AF37;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo h1 {
            margin: 0;
            font-size: clamp(24px, 8vw, 45px);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        nav { margin-top: 15px; }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
        }

        /* Layout Container */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            padding: 0 20px;
        }

        /* Gallery Section */
        .main-content {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #eee;
            transition: 0.3s;
        }

        .gallery img:hover { border-color: #D4AF37; transform: scale(1.02); }

        /* Booking Card (Black & Gold) */
        .booking-card {
            background: #111;
            color: #D4AF37;
            padding: 35px 25px;
            border-radius: 15px;
            border: 2px solid #D4AF37;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .booking-card h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
            border-bottom: 1px solid #D4AF37;
            padding-bottom: 15px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #fff;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #fff;
            color: #000;
            box-sizing: border-box;
        }

        /* WhatsApp Button */
        .whatsapp-btn {
            width: 100%;
            background: #25D366;
            color: white;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .whatsapp-btn:hover { background: #128C7E; transform: translateY(-2px); }

        /* Mobile Friendly */
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
            .booking-card { position: relative; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <h1>RB SALOON</h1>
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">Reviews</a>
            <a href="#">About</a>
        </nav>
    </header>

    <div class="container">
        <div class="main-content">
            <div class="gallery">
                <img src="https://via.placeholder.com/400x500?text=Saloon+Interior+1" alt="Saloon 1">
                <img src="https://via.placeholder.com/400x500?text=Hair+Styling" alt="Saloon 2">
                <img src="https://via.placeholder.com/400x500?text=Beard+Trim" alt="Saloon 3">
            </div>
            
            <div style="padding: 10px;">
                <h2 style="color: #000; border-left: 5px solid #D4AF37; padding-left: 15px;">Welcome to RB Saloon</h2>
                <p>Hamari premium services ke liye niche diye gaye form se slot book karein. Hum aapko behtareen grooming experience dete hain.</p>
                <div style="margin-top: 20px;">
                    <span style="background: #000; color: #fff; padding: 5px 15px; border-radius: 20px; font-size: 12px; margin-right: 10px;">Hair Cut</span>
                    <span style="background: #000; color: #fff; padding: 5px 15px; border-radius: 20px; font-size: 12px; margin-right: 10px;">Beard</span>
                    <span style="background: #000; color: #fff; padding: 5px 15px; border-radius: 20px; font-size: 12px;">Facial</span>
                </div>
            </div>
        </div>

        <div class="booking-card">
            <h2>Book Your Slot</h2>
            <form id="bookingForm">
                <div class="form-group">
                    <label>Aapka Naam</label>
                    <input type="text" id="cust_name" placeholder="Enter Full Name" required>
                </div>
                
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="cust_phone" placeholder="98765 43210" required>
                </div>

                <div class="form-group">
                    <label>Service Date & Time</label>
                    <input type="datetime-local" id="cust_date" required>
                </div>

                <button type="button" class="whatsapp-btn" onclick="sendToWhatsApp()">
                    Confirm via WhatsApp
                </button>
            </form>
            <p style="font-size: 11px; text-align: center; margin-top: 15px; color: #888;">*Aapka booking message WhatsApp par bheja jayega.</p>
        </div>
    </div>

    <script>
        function sendToWhatsApp() {
            // !!! APNA WHATSAPP NUMBER YAHAN DALEIN !!!
            var myMobile = "910000000000"; // Bina '+' ke, country code ke sath

            // Form data uthana
            var name = document.getElementById('cust_name').value;
            var phone = document.getElementById('cust_phone').value;
            var datetime = document.getElementById('cust_date').value;

            // Validation
            if(name == "" || phone == "" || datetime == "") {
                alert("Bhai, saari details toh bhar do!");
                return;
            }

            // Date format thoda saaf karna
            var cleanDate = datetime.replace("T", " ");

            // Message ka format (Bold text ke liye * use kiya hai)
            var message = "Hello RB Saloon, mujhe booking karni hai:%0a%0a" + 
                          "*Naam:* " + name + "%0a" + 
                          "*Phone:* " + phone + "%0a" + 
                          "*Time:* " + cleanDate + "%0a%0a" +
                          "Kya ye slot khali hai?";

            // WhatsApp link banana
            var finalUrl = "https://wa.me/" + myMobile + "?text=" + message;

            // Naye tab mein kholna
            window.open(finalUrl, '_blank').focus();
        }
    </script>

</body>
</html>
